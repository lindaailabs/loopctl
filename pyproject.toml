[project]
name = "loopctl"
version = "0.1.0"
description = "LangGraph-based control plane that drives coding engines through an unattended requirement-to-MR loop."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "loopctl contributors" }]
dependencies = [
    "typer>=0.12",
    "rich>=13.7",
    "pydantic>=2.7",
    "langgraph>=0.2",
    "langgraph-checkpoint-sqlite>=0.1",
    "aiosqlite>=0.20",
    "httpx>=0.27",
]

[project.scripts]
loopctl = "loopctl.cli.app:run"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/loopctl"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
norecursedirs = ["tests/fixtures", ".venv", "src"]
addopts = "-q"
